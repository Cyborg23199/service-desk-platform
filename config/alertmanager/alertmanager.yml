global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity", "component"]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 1h
  receiver: "servicedesk-default-receiver"
  routes:
    - matchers:
        - severity="critical"
      receiver: "servicedesk-critical-receiver"
      group_wait: 10s
      repeat_interval: 15m
    - matchers:
        - severity="warning"
      receiver: "servicedesk-warning-receiver"
      group_wait: 30s
      repeat_interval: 2h

receivers:
  - name: "servicedesk-default-receiver"
    webhook_configs:
      - url: "http://127.0.0.1:9093/-/healthy"
        send_resolved: true

  - name: "servicedesk-critical-receiver"
    webhook_configs:
      - url: "http://127.0.0.1:9093/-/healthy"
        send_resolved: true

  - name: "servicedesk-warning-receiver"
    webhook_configs:
      - url: "http://127.0.0.1:9093/-/healthy"
        send_resolved: true