groups:
  - name: servicedesk_availability_alerts
    rules:
      - alert: ServiceDeskAPIDown
        expr: up{job="servicedesk_api"} == 0
        for: 1m
        labels:
          severity: critical
          component: application
        annotations:
          summary: "Service Desk API target is DOWN"
          description: "Prometheus failed to scrape servicedesk_api (127.0.0.1:8000) for more than 1 minute."

      - alert: ServiceDeskPostgreSQLDown
        expr: max(servicedesk_db_up) == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL database health probe failed"
          description: "Active SELECT 1 health check returned 0 (unhealthy) for more than 1 minute."

  - name: servicedesk_application_alerts
    rules:
      - alert: HighHTTP5xxErrorRateWarning
        expr: >
          (
            sum(rate(servicedesk_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(servicedesk_http_requests_total[5m]))
          ) * 100 > 1
        for: 5m
        labels:
          severity: warning
          component: application
        annotations:
          summary: "Elevated HTTP 5xx error rate (> 1%)"
          description: "HTTP 5xx error ratio exceeded 1% over the last 5 minutes (current: {{ $value | printf \"%.2f\" }}%)."

      - alert: HighHTTP5xxErrorRateCritical
        expr: >
          (
            sum(rate(servicedesk_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(servicedesk_http_requests_total[5m]))
          ) * 100 > 5
        for: 2m
        labels:
          severity: critical
          component: application
        annotations:
          summary: "Critical HTTP 5xx error rate (> 5%)"
          description: "HTTP 5xx error ratio exceeded 5% for 2 minutes (current: {{ $value | printf \"%.2f\" }}%)."

      - alert: HighHTTP4xxClientErrorsWarning
        expr: sum(rate(servicedesk_http_requests_total{status=~"4.."}[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          component: application
        annotations:
          summary: "Elevated HTTP 4xx client error rate (> 0.5 req/s)"
          description: "HTTP 4xx client errors exceeded 0.5 req/s for 5 minutes (current: {{ $value | printf \"%.2f\" }} req/s)."

      - alert: HighAPILatencyWarning
        expr: >
          histogram_quantile(
            0.95,
            sum by (le) (rate(servicedesk_http_request_duration_seconds_bucket[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          component: application
        annotations:
          summary: "API p95 latency exceeded 500 ms"
          description: "95th percentile HTTP latency is above 0.5s for 5 minutes (current: {{ $value | printf \"%.3f\" }}s)."

      - alert: HighAPILatencyCritical
        expr: >
          histogram_quantile(
            0.95,
            sum by (le) (rate(servicedesk_http_request_duration_seconds_bucket[5m]))
          ) > 1.5
        for: 3m
        labels:
          severity: critical
          component: application
        annotations:
          summary: "API p95 latency exceeded 1.5 s"
          description: "95th percentile HTTP latency is above 1.5s for 3 minutes (current: {{ $value | printf \"%.3f\" }}s)."

  - name: servicedesk_infrastructure_alerts
    rules:
      - alert: HighHostCPUUsageWarning
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 75
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Host CPU utilization exceeded 75%"
          description: "VM CPU utilization has stayed above 75% for 5 minutes (current: {{ $value | printf \"%.1f\" }}%)."

      - alert: HighHostCPUUsageCritical
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 90
        for: 3m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Host CPU utilization critical (> 90%)"
          description: "VM CPU utilization has stayed above 90% for 3 minutes (current: {{ $value | printf \"%.1f\" }}%)."

      - alert: HighHostMemoryUsageWarning
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Host RAM utilization exceeded 80%"
          description: "VM RAM utilization has stayed above 80% for 5 minutes (current: {{ $value | printf \"%.1f\" }}%)."

      - alert: HighHostMemoryUsageCritical
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 92
        for: 2m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Host RAM utilization critical (> 92%)"
          description: "VM RAM utilization is above 92% for 2 minutes; high OOM risk (current: {{ $value | printf \"%.1f\" }}%)."

      - alert: HighRootDiskUsageWarning
        expr: >
          (
            1 - (
              node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"}
              /
              node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"}
            )
          ) * 100 > 80
        for: 10m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Root filesystem (/) usage exceeded 80%"
          description: "Root disk usage has stayed above 80% for 10 minutes (current: {{ $value | printf \"%.1f\" }}%)."

      - alert: HighRootDiskUsageCritical
        expr: >
          (
            1 - (
              node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"}
              /
              node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"}
            )
          ) * 100 > 90
        for: 5m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Root filesystem (/) usage critical (> 90%)"
          description: "Root disk usage has stayed above 90% for 5 minutes (current: {{ $value | printf \"%.1f\" }}%)."